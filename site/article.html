<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Myness</title>
<script>
  // 旧URL(article.html?date=...&id=...)を新しい記事表示へ転送する（Discordの過去の通知用）
  const p = new URLSearchParams(location.search);
  const date = p.get("date"), id = p.get("id");
  location.replace("./" + (date ? "#/" + date + (id ? "/" + encodeURIComponent(id) : "") : ""));
</script>
</head>
<body></body>
</html>
