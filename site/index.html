<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11171E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Myness">
<title>Myness</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="masthead">
  <div class="edition">
    <span id="edition-date" class="edition-date"></span>
    <span id="edition-day" class="edition-day"></span>
  </div>
  <ol id="date-strip" class="date-strip" aria-label="日付"></ol>
</header>

<nav id="filters" class="filters" aria-label="カテゴリ"></nav>

<main id="feed" class="feed" aria-live="polite"></main>

<div id="reader" class="reader" role="dialog" aria-modal="true" hidden>
  <div class="reader-scroll" id="reader-scroll">
    <article id="reader-article" class="reader-article"></article>
  </div>
  <button id="reader-close" class="reader-close" aria-label="閉じる">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="reader-bar">
    <button id="reader-save" class="save-btn" aria-pressed="false" aria-label="保存"></button>
    <a id="reader-source" class="source-btn" target="_blank" rel="noopener noreferrer">元記事を開く</a>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
