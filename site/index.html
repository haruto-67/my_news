<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My News</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <h1>My News</h1>
  <div class="controls">
    <select id="date-select" aria-label="日付を選択"></select>
    <label class="favorites-toggle">
      <input type="checkbox" id="favorites-only">
      お気に入りのみ
    </label>
  </div>
</header>

<nav id="category-tabs" class="category-tabs" aria-label="カテゴリ絞り込み"></nav>

<main id="content">
  <p id="status" class="status">読み込み中...</p>
  <div id="categories"></div>
</main>

<footer class="app-footer">
  <span id="generated-at"></span>
</footer>

<script src="js/app.js"></script>
</body>
</html>
